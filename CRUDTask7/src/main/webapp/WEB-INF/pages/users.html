<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Пользователи</h1>
<a th:href="@{/users/add}" class="btn btn-add">Добавить</a>
<table>
    <thead>
    <tr>
        <th>Id</th>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Email</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">Id</td>
        <td th:text="${user.name}">Name</td>
        <td th:text="${user.lastName}">LastName</td>
        <td th:text="${user.email}">Email</td>
        <td>
            <a class="btn btn-edit" th:href="@{/users/edit(id=${user.id})}">Изменить</a>
            <a class="btn btn-delete" th:href="@{/users/delete(id=${user.id})}"
               onclick="return confirm('Вы уверены?')">Удалить</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
